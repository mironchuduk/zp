<div class="wrap"><aside><div class="logo">zp</div><nav id="nav"><a data-v="home">Главная</a><a data-v="cos">Компании</a><a data-v="years">Годы</a><a data-v="career">Карьера</a></nav>
<div class="set">Настройки<label>Часов в месяц<input id="h" type="number" step="0.1"></label><label>Дней в месяц<input id="d" type="number" step="1"></label><label>Инфляция (запасная), %<input id="i" type="number" step="0.1"></label><div id="upd" style="margin-top:10px"></div><div id="rst" style="margin-top:8px;cursor:pointer;text-decoration:underline">Сбросить порядок блоков</div></div></aside>

<script>
const $=s=>document.querySelector(s),COL=['#6c4de0','#3aa6e8','#f0a35e','#e4607a','#4fbf8f','#9aa0b4'],MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const n0=x=>x==null?'—':Math.round(x).toLocaleString('ru-RU'),$$=x=>x==null?'—':n0(x)+'\u00a0$',n2=x=>x==null?'—':x.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}),pc=x=>x==null?'—':(x>0?'+':'')+(x*100).toFixed(1).replace('.',',')+'%',gc=x=>x==null?'':x>0?'up':'dn';
const fm=x=>String(Math.round(x*10)/10).replace('.',','),mname=m=>MN[m.idx%12]+' '+Math.floor(m.idx/12),dt=d=>d.toLocaleDateString('ru-RU');
let R,D,view='home',per='12',sel=null,hide=new Set(),ex=new Set(),st={h:+localStorage.h||168.7,i:+localStorage.i||3,d:+localStorage.d||21};
$('#h').value=st.h;$('#i').value=st.i;$('#d').value=st.d;
['h','i','d'].forEach(k=>$('#'+k).onchange=e=>{st[k]=+e.target.value;localStorage[k]=st[k];calc();draw()});
$('#nav').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;draw()}};
const card=(ic,l,v,s,c='')=>`<div class="card" data-cid="${l}"><span class="mv mc"><b data-mc="-1">‹</b><b data-mc="1">›</b><i class="gc" title="Перетащить">⠿</i></span><div class="cap"><span class="ic">${ic}</span>${l}</div><div class="v ${c}">${v}</div><div class="s">${s||''}</div></div>`;
const FXID={USD:431,EUR:451,RUB:456},SC={USD:1,EUR:1,RUB:100},dayOf=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5,iso=d=>new Date(d*864e5).toISOString().slice(0,10);
let fx=()=>1,fxUsed=false;
async function getFx(R){const used=new Set(R.map(r=>r.cur));fxUsed=false;if(used.size==1&&used.has('USD'))return()=>1;fxUsed=true;
 const need=['USD',...[...used].filter(c=>c!='USD'&&c!='BYN')],today=dayOf(new Date()),minD=Math.min(...R.flatMap(r=>[r.s,r.e,r.pay].filter(Boolean).map(dayOf))),lo=minD,N=today+62-lo+1,A={};
 for(const c of need){let ch;try{ch=JSON.parse(localStorage['fx_'+c])}catch(e){ch=null}if(!ch||!ch.d)ch={d:{}};
  const from=ch.lo&&minD>=ch.lo?Math.max(minD,ch.hi-3):minD;
  try{for(let a=from;a<=today;a+=360){const b=Math.min(a+359,today),r=await fetch(`https://api.nbrb.by/exrates/rates/dynamics/${FXID[c]}?startdate=${iso(a)}&enddate=${iso(b)}`);if(!r.ok)throw new Error(r.status);
    (await r.json()).forEach(x=>{ch.d[dayOf(new Date(x.Date))]=x.Cur_OfficialRate/SC[c]})}
   ch.lo=Math.min(ch.lo||minD,minD);ch.hi=today;localStorage['fx_'+c]=JSON.stringify(ch)}
  catch(e){if(!Object.keys(ch.d).length)throw new Error('Не удалось получить курсы НБ РБ для '+c+' ('+e.message+'). Проверьте интернет и попробуйте позже.')}
  const keys=Object.keys(ch.d).map(Number).sort((x,y)=>x-y),arr=new Float64Array(N);let last=0,k=0;
  for(let i=0;i<N;i++){while(k<keys.length&&keys[k]<=lo+i){last=ch.d[keys[k]];k++}arr[i]=last}
  const f=arr.find(v=>v>0);for(let i=0;i<N&&!arr[i];i++)arr[i]=f;A[c]=arr}
 const byn=(c,d)=>c=='BYN'?1:A[c][Math.min(Math.max(d-lo,0),N-1)];return(c,d)=>c=='USD'?1:byn(c,d)/byn('USD',d)}
const CW=()=>Math.max(520,Math.min(2000,(($('#main')||{}).clientWidth||772)-52));
let cpi=i=>Math.pow(1+st.i/100,i/12),cpiSrc='ручная ставка';
function mkCpi(p){p.sort((a,b)=>a[0]-b[0]);const f=p[0],l=p[p.length-1],g=()=>1+st.i/100;
 return i=>{if(i<=f[0])return f[1]/Math.pow(g(),(f[0]-i)/12);if(i>=l[0])return l[1]*Math.pow(g(),(i-l[0])/12);let k=0;while(p[k+1][0]<i)k++;const a=p[k],b=p[k+1];return a[1]*Math.pow(b[1]/a[1],(i-a[0])/(b[0]-a[0]))}}
async function fredCpi(){const r=await fetch('https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL&cosd=2015-01-01');if(!r.ok)throw 0;const p=(await r.text()).trim().split('\n').slice(1).map(l=>l.split(',')).map(([d,v])=>[+d.slice(0,4)*12+(+d.slice(5,7)-1),parseFloat(v)]).filter(x=>x[1]>0);if(p.length<12)throw 0;return p}
async function wbCpi(){const r=await fetch('https://api.worldbank.org/v2/country/USA/indicator/FP.CPI.TOTL.ZG?format=json&per_page=100&date=2010:'+new Date().getFullYear());if(!r.ok)throw 0;const j=(await r.json())[1].filter(x=>x.value!=null).map(x=>[+x.date,x.value]).sort((a,b)=>a[0]-b[0]);if(!j.length)throw 0;let q=1;const p=[[(j[0][0]-1)*12+6,1]];j.forEach(([y,v])=>{q*=1+v/100;p.push([y*12+6,q])});return p}
async function loadCpi(){let c;try{c=JSON.parse(localStorage.cpi)}catch(e){}
 if(!c||Date.now()-c.t>6048e5){let n=null;try{n={pts:await fredCpi(),src:'США CPI (FRED), помесячно'}}catch(e){try{n={pts:await wbCpi(),src:'США CPI (World Bank), по годам'}}catch(e2){}}if(n){c={t:Date.now(),...n};localStorage.cpi=JSON.stringify(c)}}
 if(c&&c.pts&&c.pts.length>1){cpi=mkCpi(c.pts);cpiSrc=c.src}else{cpi=i=>Math.pow(1+st.i/100,i/12);cpiSrc='ручная ставка '+st.i+'%'}}
function calc(){D=Calc.compute(R,{hours:st.h,infl:st.i/100,fx,cpi})}
function range(){const M=D.M;if(per=='all'||per=='now')return M;if(per=='12')return M.slice(-12);return M.filter(m=>Math.floor(m.idx/12)==+per)}
function nice(v){const e=Math.pow(10,Math.floor(Math.log10(v/4))),f=v/4/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function chart(ms,vis,main,k0){const W=CW(),H=main?250:200,pl=42,pb=22,pt=10,tot=m=>m.s.reduce((a,v,k)=>a+(vis[k]?v+m.p[k]:0),0),mx=nice(Math.max(1,...ms.map(tot))*(ms.length<=14?1.12:1.02))*4,bw=(W-pl)/ms.length,bwid=Math.min(bw*.7,48),y=v=>pt+(H-pt-pb)*(1-v/mx);let g='';
 for(let t=0;t<=4;t++){const v=mx*t/4;g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${n0(v)}</text>`}
 ms.forEach((m,j)=>{const x=pl+j*bw;let a=0;D.C.forEach(c=>{if(!vis[c.k])return;[[m.s[c.k],1],[m.p[c.k],.4]].forEach(([v,o])=>{if(v>0){g+=`<rect class="bar" x="${x+(bw-bwid)/2}" y="${y(a+v)}" width="${bwid}" height="${y(a)-y(a+v)}" fill="${COL[c.k%6]}" opacity="${o}" rx="2"/>`;a+=v}})});
  if(ms.length<=14&&a>0)g+=`<text x="${x+bw/2}" y="${y(a)-6}" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:600;pointer-events:none">${n0(a)}</text>`;if(ms.length<=14||j%Math.ceil(ms.length/10)==0)g+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${MN[m.idx%12]} ${String(Math.floor(m.idx/12)).slice(2)}</text>`;
  const tp=main?`<b>${mname(m)}</b><br>${$$(m.tot)}${m.prT>0?'<br>из них премии '+$$(m.prT):''}`:`<b>${mname(m)}</b><br>${$$(m.s[k0]+m.p[k0])}${m.p[k0]>0?'<br>из них премия '+$$(m.p[k0]):''}`;
  g+=`<rect ${main?`data-i="${m.i}"`:''} data-tip="${tp.replace(/"/g,'&quot;')}" x="${x}" y="0" width="${bw}" height="${H-pb}" fill="${main&&sel==m.i?'#6c4de022':'transparent'}"/>`});
 return`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`}
const pct=x=>(x*100).toFixed(1).replace('.',',')+'%';
function dist(ms){const lab=per=='all'||per=='now'?'за всё время':per=='12'?'за последние 12 месяцев':'за '+per+' год';
 const C=D.C.map(c=>({c,t:ms.reduce((a,m)=>a+m.s[c.k]+m.p[c.k],0),p:ms.reduce((a,m)=>a+m.p[c.k],0)})).filter(x=>x.t>0.005).sort((a,b)=>b.t-a.t),T=C.reduce((a,x)=>a+x.t,0);
 if(!T)return`<div class="card big"><div class="cap">Вклад компаний</div><div class="s" style="margin-top:10px">Нет дохода за выбранный период</div></div>`;
 const R=62,Ln=2*Math.PI*R;let off=0;
 const arcs=C.map(x=>{const f=x.t/T,s=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${COL[x.c.k%6]}" stroke-width="26" stroke-dasharray="${Math.max(f*Ln-(C.length>1?2:0),0.1)} ${Ln}" stroke-dashoffset="${-off*Ln}" transform="rotate(-90 90 90)" data-tip="<b>${x.c.name}</b><br>${$$(x.t)} · ${pct(f)}"/>`;off+=f;return s}).join('');
 return`<div class="card big"><div class="cap">Вклад компаний, ${lab}</div><div class="dist"><svg viewBox="0 0 180 180" width="180" height="180">${arcs}<text x="90" y="86" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--ink)">${$$(T)}</text><text x="90" y="104" text-anchor="middle" style="font-size:10px">всего</text></svg>

document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-mv]');if(!a)return;const b=a.closest('.blk'),dn=+a.dataset.mv>0,s=dn?b.nextElementSibling:b.previousElementSibling;if(s&&s.classList.contains('blk')){s.parentNode.insertBefore(b,dn?s.nextSibling:s);saveOrder(b.dataset.view)}});
document.addEventListener('mousedown',e=>{const g=e.target.closest&&e.target.closest('.gr');if(g)g.closest('.blk').draggable=true});
document.addEventListener('dragstart',e=>{const b=e.target.closest&&(e.target.closest('.card[draggable=true]')||e.target.closest('.blk[draggable=true]'));if(!b)return;drag=b;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',b.dataset.b);b.classList.add('dragging')});
document.addEventListener('dragover',e=>{if(!drag||!drag.classList.contains('blk'))return;e.preventDefault();const t=e.target.closest('.blk');if(t&&t!=drag&&t.dataset.view==drag.dataset.view){const r=t.getBoundingClientRect();t.parentNode.insertBefore(drag,e.clientY<r.top+r.height/2?t:t.nextSibling)}});
document.addEventListener('dragend',()=>{if(!drag)return;drag.draggable=false;drag.classList.remove('dragging');if(drag.classList.contains('card'))saveCards(drag.parentNode);else saveOrder(drag.dataset.view);drag=null});
$('#rst').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith('ord_')||k.startsWith('oc_')).forEach(k=>delete localStorage[k]);if(D)draw()};
const cardOrder=()=>document.querySelectorAll('.grid[data-g]').forEach(g=>{let o=[];try{o=JSON.parse(localStorage['oc_'+g.dataset.g]||'[]')}catch(e){}if(!o.length)return;const ix=c=>{const i=o.indexOf(c.dataset.cid);return i<0?99:i};[...g.children].sort((a,b)=>ix(a)-ix(b)).forEach(c=>g.appendChild(c))}),
 saveCards=g=>{localStorage['oc_'+g.dataset.g]=JSON.stringify([...g.children].map(c=>c.dataset.cid))};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-mc]');if(!a)return;const c=a.closest('.card'),dn=+a.dataset.mc>0,s=dn?c.nextElementSibling:c.previousElementSibling;if(s){c.parentNode.insertBefore(c,dn?s.nextSibling:s);saveCards(c.parentNode)}});
document.addEventListener('mousedown',e=>{const g=e.target.closest&&e.target.closest('.gc');if(g)g.closest('.card').draggable=true});
document.addEventListener('dragover',e=>{if(!drag||!drag.classList.contains('card'))return;e.preventDefault();const t=e.target.closest('.card');if(t&&t!=drag&&t.parentNode==drag.parentNode){const r=t.getBoundingClientRect();t.parentNode.insertBefore(drag,e.clientX<r.left+r.width/2?t:t.nextSibling)}});
if(typeof window!='undefined'){let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(D)draw()},200)})}
function draw(){document.querySelectorAll('nav a').forEach(a=>a.className=a.dataset.v==view?'on':'');$('#main').innerHTML={home,cos,years,career}[view]();const p=$('#per');if(p){p.value=per;p.onchange=e=>{per=e.target.value;sel=null;draw()}}cardOrder()}
const tip=$('#tip'),th=$('#th');
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.theme=t;th.textContent=t=='dark'?'☀':'☾';document.querySelector('meta[name=theme-color]').content=t=='dark'?'#0e0f14':'#f3f4f8'}
th.onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme||'light');
document.addEventListener('click',e=>{const t=e.target,k=t.closest('[data-k]'),y=t.closest('[data-y]'),co=t.closest('[data-co]'),pb=t.closest('[data-p]');
 if(pb){per=pb.dataset.p;sel=null;draw()}
 else if(k){const i=+k.dataset.k;hide.has(i)?hide.delete(i):hide.add(i);draw()}
 else if(co){const i=+co.dataset.co;ex.has(i)?ex.delete(i):ex.add(i);draw()}
 else if(y&&y.dataset.y){per=y.dataset.y;view='home';sel=null;draw()}
 else if(t.dataset.i!=null){sel=+t.dataset.i;draw()}});
document.addEventListener('mousemove',e=>{const x=e.target.dataset&&e.target.dataset.tip;if(!x){tip.style.display='none';return}tip.innerHTML=x;tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px'});
async function load(){try{
 if(location.protocol=='file:')throw new Error('Страница открыта как файл на компьютере. Браузер так не пускает к данным из интернета. Откройте сайт по адресу GitHub Pages (https://...github.io/...).');
 let r;try{r=await fetch(CFG.csv,{cache:'no-store'})}catch(e){throw new Error('Браузер не смог получить таблицу (сеть, блокировщик рекламы или Google отклонил запрос). <a href="'+CFG.csv+'" target="_blank">Откройте ссылку на таблицу напрямую</a>: должен скачаться или показаться CSV. Если там ошибка, лист не опубликован как CSV.')}
 if(!r.ok)throw new Error('Таблица недоступна (код '+r.status+'). Проверьте публикацию листа и ссылку в config.js');
 R=Calc.rows(await r.text());fx=await getFx(R);try{await loadCpi()}catch(e){}calc();$('#upd').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});$('#upd').title=(fxUsed?'Курсы НБ РБ, всё в USD. ':'')+'Инфляция: '+cpiSrc;draw()}catch(e){$('#main').innerHTML=`<div class="err"><b>Не удалось загрузить данные.</b><br>${e.message}</div>`}}
load();
</script></body></html>
